services:
  # ---------------------------------------------------------------------
  # Airflow — orchestrates the pipeline as a scheduled, monitored DAG.
  # "standalone" mode: single container, SQLite metadata DB (this was
  # already true before the v3 rework — Airflow's own metadata store
  # was never the Postgres warehouse, so removing that warehouse
  # doesn't change anything here).
  # Web UI at http://localhost:8083 once it's up.
  #
  # The warehouse itself is now Databricks (Free Edition, serverless) —
  # a managed cloud workspace, not a local container. This DAG's tasks
  # call the Databricks Jobs API rather than talking to a local Postgres
  # service, so there's no local warehouse container to depend on here.
  # ---------------------------------------------------------------------
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: healthcare_airflow
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Set these in a local .env file (gitignored) or export them
      # before `docker compose up` — never commit real values.
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    ports:
      - "8083:8080"
    volumes:
      # ./dbt must contain a real profiles.yml (gitignored — copy from
      # dbt/profiles.yml.sample) for dbt to find at /opt/airflow/dbt/profiles.yml
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
      - ./databricks:/opt/airflow/databricks
      - airflow_home:/opt/airflow
    command: standalone

  # ---------------------------------------------------------------------
  # Kafka — single-node broker in KRaft mode (no ZooKeeper needed).
  # PLAINTEXT listener for container-to-container traffic (kafka:9092),
  # EXTERNAL listener for host-machine tools if you ever want to connect
  # directly (localhost:9094).
  #
  # This stays local/self-hosted deliberately: Databricks Free Edition
  # is serverless-only with restricted outbound network access, so it
  # cannot open a connection to a broker running here. The consumer
  # below writes cleaned events to a landing folder instead; Databricks
  # Auto Loader picks those up from there. See KAFKA_README.md.
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: healthcare_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # One-shot: creates the "adt-events" topic, then exits.
  kafka-init:
    image: apache/kafka:latest
    container_name: healthcare_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic adt-events --partitions 3 --replication-factor 1 &&
      echo 'Topic ready.'
      "

  # Browser UI for Kafka — browse topics, partitions, and messages.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: healthcare_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8084:8080"

volumes:
  airflow_home:
